<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Izotov's Journal</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body {
    min-height: 100vh;
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, 'SF Pro Display', 'Inter', sans-serif;
    padding: 24px 20px calc(100px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  /* ===== SPLASH ===== */
  .splash {
    position: fixed; inset: 0; z-index: 9999; background: #0a0a0a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  .splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.7; }
  .splash-content { position: relative; z-index: 2; text-align: center; padding: 0 20px; }
  .splash-title {
    font-size: clamp(28px, 9vw, 42px); font-weight: 700; letter-spacing: -0.045em; line-height: 1.05; color: #fff;
    opacity: 0; animation: fadeUp 0.6s ease 0.4s forwards;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== ANIMATIONS ===== */
  .fade-in { animation: fadeIn 0.4s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== HEADER ===== */
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .brand { font-size: 22px; font-weight: 700; color: #fff; }
  .brand span { color: #888; }
  
  .auth-btn {
    background: #1a1a1a; border: 1px solid #262626; color: #888;
    padding: 8px 16px; border-radius: 10px; font-size: 12px;
    font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.2s;
  }
  .auth-btn.editor { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }

  /* ===== SYNC ===== */
  .sync-status {
    display: flex; align-items: center; gap: 8px; font-size: 11px;
    color: #666; margin-bottom: 24px; font-weight: 500;
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #666; transition: 0.3s; }
  .sync-status.online .sync-dot { background: #10b981; box-shadow: 0 0 8px #10b981; }
  .sync-status.online { color: #10b981; }
  .sync-status.syncing .sync-dot { background: #f59e0b; animation: pulse 1s infinite; }
  .sync-status.error .sync-dot { background: #ef4444; }
  .sync-status.error { color: #ef4444; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ===== BUTTONS ===== */
  .add-btn {
    width: 100%; background: #fff; color: #000; border: none; border-radius: 14px;
    padding: 16px; font-size: 15px; font-weight: 700; font-family: inherit;
    cursor: pointer; margin-bottom: 24px; transition: 0.15s;
  }
  .add-btn:active { transform: scale(0.97); opacity: 0.8; }

  .section-title {
    font-size: 11px; color: #666; text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 700; margin-bottom: 16px;
    display: flex; justify-content: space-between;
  }

  /* ===== CHALLENGE CARD ===== */
  .challenge-card {
    background: #111; border: 1px solid #1f1f1f; border-radius: 18px;
    padding: 20px; margin-bottom: 12px; cursor: pointer; transition: 0.25s;
    position: relative;
  }
  .challenge-card:active { transform: scale(0.98); background: #1a1a1a; }
  
  /* ИСПРАВЛЕНО: Отступ справа для всего блока, чтобы крестик не перекрывал статус */
  .challenge-header { 
    display: flex; justify-content: space-between; align-items: flex-start; 
    margin-bottom: 16px; padding-right: 36px; 
  }
  .challenge-name-wrap { flex: 1; min-width: 0; padding-right: 12px; }
  .challenge-name { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .challenge-meta { font-size: 13px; color: #666; }
  
  .challenge-status { 
    font-size: 11px; padding: 4px 10px; border-radius: 8px; font-weight: 700; 
    text-transform: uppercase; flex-shrink: 0; margin-top: 2px;
  }
  .challenge-status.active { background: #1a1a1a; color: #888; }
  .challenge-status.passed { background: rgba(16,185,129,0.1); color: #10b981; }
  .challenge-status.failed { background: rgba(239,68,68,0.1); color: #ef4444; }

  .del-ch {
    position: absolute; top: 18px; right: 18px; background: #1a1a1a;
    border: 1px solid #262626; color: #888; width: 26px; height: 26px; border-radius: 8px;
    font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.2s; z-index: 2;
  }
  .del-ch:active { background: #333; color: #fff; }

  .progress-bar-bg { height: 6px; background: #1f1f1f; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .progress-bar-fill { height: 100%; background: #fff; border-radius: 3px; transition: width 0.6s ease; }
  .progress-bar-fill.bg-green { background: #10b981; }
  .progress-bar-fill.bg-red { background: #ef4444; }

  .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: #888; }
  .progress-text b { color: #fff; }

  /* ===== DETAIL ===== */
  .back-btn {
    background: none; border: none; color: #888; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer; padding: 0; margin-bottom: 20px; transition: 0.2s;
  }
  .back-btn:active { color: #fff; }

  .detail-header { background: #111; border: 1px solid #1f1f1f; border-radius: 20px; padding: 24px; margin-bottom: 24px; }
  .detail-name { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 20px; }
  
  .detail-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; text-align: center; margin-bottom: 20px; }
  .stat-box { background: #0a0a0a; padding: 14px 8px; border-radius: 12px; }
  .stat-val { font-size: 18px; font-weight: 700; color: #fff; }
  .stat-lbl { font-size: 10px; color: #666; margin-top: 4px; text-transform: uppercase; }

  /* ===== TRADES ===== */
  .trade-item {
    background: #111; border: 1px solid #1f1f1f; border-radius: 14px;
    padding: 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    animation: fadeIn 0.3s ease;
  }
  .trade-left { flex: 1; }
  .trade-ticker { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .trade-date { font-size: 12px; color: #666; }
  .trade-right { display: flex; align-items: center; gap: 12px; }
  .trade-pnl { font-size: 16px; font-weight: 700; }
  .trade-pnl.pos { color: #fff; }
  .trade-pnl.neg { color: #888; }

  .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
  .badge.long { background: #fff; color: #000; }
  .badge.short { background: #333; color: #fff; }
  .badge.rr { background: #1a1a1a; color: #aaa; }

  .del-btn { background: none; border: none; color: #444; font-size: 20px; cursor: pointer; padding: 0 4px; }

  /* ===== MODALS ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    opacity: 0; transition: opacity 0.3s;
  }
  .modal-overlay.on { display: flex; opacity: 1; }
  
  .modal-box {
    background: #111; border: 1px solid #262626; border-radius: 24px; padding: 24px; width: 100%; max-width: 400px;
    transform: translateY(20px); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .modal-overlay.on .modal-box { transform: translateY(0); }
  
  .modal-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 20px; }
  
  .input-group { margin-bottom: 16px; }
  .input-label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
  .input-field {
    width: 100%; background: #0a0a0a; border: 1px solid #262626; border-radius: 12px;
    padding: 14px; color: #fff; font-size: 15px; font-family: inherit; outline: none;
    transition: border 0.2s; -webkit-appearance: none; appearance: none;
  }
  .input-field:focus { border-color: #666; }
  
  /* ИСПРАВЛЕНО: Поле даты больше не вылезает */
  input[type="date"] {
    text-align: left;
    min-width: 100%;
    max-width: 100%;
    display: block;
  }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; padding: 0; margin-left: 8px; }

  .btn-row { display: flex; gap: 10px; margin-top: 24px; }
  .btn-cancel { flex: 1; background: #1f1f1f; color: #888; border: none; border-radius: 12px; padding: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn-cancel:active { background: #262626; }
  .btn-save { flex: 2; background: #fff; color: #000; border: none; border-radius: 12px; padding: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .btn-save:active { opacity: 0.8; }

  .dir-toggle { display: flex; gap: 8px; }
  .dir-btn { flex: 1; padding: 14px; border-radius: 12px; background: #0a0a0a; border: 1px solid #262626; color: #666; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .dir-btn.active-long { background: #fff; border-color: #fff; color: #000; }
  .dir-btn.active-short { background: #333; border-color: #333; color: #fff; }

  .rr-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .rr-field { display: flex; flex-direction: column; }
  .rr-field label { font-size: 10px; color: #666; margin-bottom: 4px; }
  .rr-field input { padding: 10px; text-align: center; font-size: 14px; }
  .rr-result { text-align: right; font-size: 13px; color: #888; font-weight: 600; }
  .rr-result span { color: #fff; font-weight: 700; margin-left: 6px; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #fff; color: #000; padding: 14px 24px; border-radius: 12px;
    font-size: 14px; font-weight: 700; z-index: 200; opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <canvas id="splash-canvas"></canvas>
  <div class="splash-content">
    <div class="splash-title">Izotov's Journal</div>
  </div>
</div>

<header>
  <div class="brand">Izotov's <span>Journal</span></div>
  <button class="auth-btn" id="auth-btn">🔒</button>
</header>

<div class="sync-status" id="sync-status">
  <div class="sync-dot"></div>
  <span id="sync-text">Connecting...</span>
</div>

<!-- MAIN VIEW -->
<div id="view-main" class="fade-in">
  <button class="add-btn" id="btn-add-challenge">+ New Challenge</button>
  
  <div class="section-title">
    <span>My Challenges</span>
    <span id="challenges-count"></span>
  </div>
  
  <div id="challenges-list"></div>
</div>

<!-- DETAIL VIEW -->
<div id="view-detail" style="display: none;">
  <button class="back-btn" id="btn-back">← Back to list</button>
  
  <div class="detail-header">
    <div class="detail-name" id="detail-name">Name</div>
    
    <div style="margin-bottom: 20px;">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="detail-progress-bar" style="width: 0%"></div>
      </div>
      <div class="progress-text">
        <span>Target: <b id="detail-target-text">0</b></span>
        <span id="detail-status-text">In Progress</span>
      </div>
    </div>

    <div class="detail-stats">
      <div class="stat-box"><div class="stat-val" id="detail-wr">0%</div><div class="stat-lbl">Winrate</div></div>
      <div class="stat-box"><div class="stat-val" id="detail-rr">0.0</div><div class="stat-lbl">Avg RR</div></div>
      <div class="stat-box"><div class="stat-val" id="detail-trades">0</div><div class="stat-lbl">Trades</div></div>
    </div>
  </div>

  <button class="add-btn" id="btn-add-trade" style="background:#fff;">+ Add Trade</button>
  
  <div class="section-title">Trade History</div>
  <div id="trades-list"></div>
</div>

<!-- CHALLENGE MODAL -->
<div class="modal-overlay" id="modal-challenge">
  <div class="modal-box">
    <div class="modal-title">New Challenge</div>
    <div class="input-group"><label class="input-label">Name</label><input type="text" class="input-field" id="new-ch-name" placeholder="FundedNext 10k"></div>
    <div class="input-group"><label class="input-label">Account Size ($)</label><input type="number" class="input-field" id="new-ch-size" placeholder="10000"></div>
    <div class="input-group"><label class="input-label">Profit Target (%)</label><input type="number" class="input-field" id="new-ch-target" placeholder="8"></div>
    <div class="input-group"><label class="input-label">Daily Limit (%)</label><input type="number" class="input-field" id="new-ch-daily" placeholder="5"></div>
    <div class="input-group"><label class="input-label">Total Limit (%)</label><input type="number" class="input-field" id="new-ch-total" placeholder="10"></div>
    <div class="btn-row"><button class="btn-cancel" id="cancel-ch">Cancel</button><button class="btn-save" id="save-ch">Create</button></div>
  </div>
</div>

<!-- TRADE MODAL -->
<div class="modal-overlay" id="modal-trade">
  <div class="modal-box">
    <div class="modal-title">New Trade</div>
    <div class="input-group"><label class="input-label">Ticker</label><input type="text" class="input-field" id="tr-ticker" placeholder="NDX100"></div>
    
    <div class="input-group">
      <label class="input-label">Direction</label>
      <div class="dir-toggle">
        <button class="dir-btn active-long" id="btn-long">LONG</button>
        <button class="dir-btn" id="btn-short">SHORT</button>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Risk / Reward</label>
      <div class="rr-inputs">
        <div class="rr-field"><label>Entry</label><input type="number" class="input-field" id="tr-entry" step="0.01"></div>
        <div class="rr-field"><label>Stop</label><input type="number" class="input-field" id="tr-stop" step="0.01"></div>
        <div class="rr-field"><label>Take</label><input type="number" class="input-field" id="tr-take" step="0.01"></div>
      </div>
      <div class="rr-result">R:R <span id="tr-rr-display">—</span></div>
    </div>

    <div class="input-group"><label class="input-label">P&L ($)</label><input type="number" class="input-field" id="tr-pnl" placeholder="0.00" step="0.01"></div>
    <div class="input-group"><label class="input-label">Date</label><input type="date" class="input-field" id="tr-date"></div>
    <div class="input-group"><label class="input-label">Note</label><input type="text" class="input-field" id="tr-note" placeholder="Optional"></div>
    
    <div class="btn-row"><button class="btn-cancel" id="cancel-tr">Cancel</button><button class="btn-save" id="save-tr">Save</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ============================================
  // SPLASH ANIMATION
  // ============================================
  (function splash() {
    const canvas = document.getElementById('splash-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    const candles = [];
    const COUNT = 26;
    let price = 50;
    for (let i = 0; i < COUNT; i++) {
      const o = price;
      const c = o + (Math.random() - 0.45) * 10;
      const h = Math.max(o, c) + Math.random() * 5;
      const l = Math.min(o, c) - Math.random() * 5;
      candles.push({ o, c, h, l });
      price = c;
    }
    const all = candles.flatMap(c => [c.h, c.l]);
    const max = Math.max.apply(null, all);
    const min = Math.min.apply(null, all);
    const range = max - min || 1;

    let startTime = null;
    const DURATION = 1200;

    function draw(t) {
      if (!startTime) startTime = t;
      const progress = Math.min(1, (t - startTime) / DURATION);
      ctx.clearRect(0, 0, W, H);
      const padX = W * 0.08, padY = H * 0.3, chartW = W - padX * 2, chartH = H * 0.4;
      const cw = chartW / COUNT, bodyW = cw * 0.5;
      const yOf = v => padY + chartH - ((v - min) / range) * chartH;
      const visible = progress * COUNT;

      candles.forEach((c, i) => {
        const appear = Math.min(1, Math.max(0, visible - i));
        if (appear <= 0) return;
        const x = padX + i * cw + cw / 2;
        const up = c.c >= c.o;
        ctx.strokeStyle = up ? 'rgba(255,255,255,0.4)' : 'rgba(80,80,80,0.5)';
        ctx.globalAlpha = appear * 0.7;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, yOf(c.h)); ctx.lineTo(x, yOf(c.l)); ctx.stroke();
        const bodyTop = yOf(Math.max(c.o, c.c));
        const bodyBot = yOf(Math.min(c.o, c.c));
        const bodyH = Math.max(2, bodyBot - bodyTop);
        ctx.globalAlpha = appear;
        ctx.fillStyle = up ? '#ffffff' : '#2a2a2a';
        ctx.fillRect(x - bodyW / 2, bodyTop, bodyW, bodyH);
      });
      ctx.globalAlpha = 1;

      if (progress < 1) requestAnimationFrame(draw);
      else {
        setTimeout(() => {
          const spl = document.getElementById('splash');
          if(spl) { spl.classList.add('hide'); setTimeout(() => spl.style.display = 'none', 800); }
        }, 200);
      }
    }
    requestAnimationFrame(draw);
  })();

  // ============================================
  // FIREBASE
  // ============================================
  const firebaseConfig = {
    apiKey: "AIzaSyCgOEckc1xoTrJEdcRXGi_TsfsW-y02AcQ",
    authDomain: "journal-ebc24.firebaseapp.com",
    projectId: "journal-ebc24",
    storageBucket: "journal-ebc24.firebasestorage.app",
    messagingSenderId: "129678065280",
    appId: "1:129678065280:web:16237ab65b3693399d7065"
  };

  let db = null, DOC_REF = null;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    DOC_REF = db.collection('izotov_journal_v10').doc('main');
  } catch (e) { console.warn('Firebase offline'); }

  const PASSWORD = '2773';
  const AUTH_KEY = 'izotov_auth_v10';
  const DATA_KEY = 'izotov_data_v10';

  let state = { challenges: [] };
  let currentChallengeId = null;
  let isEditor = false;
  let currentDir = 'long';
  let toastTimer = null;

  // ============================================
  // UTILS
  // ============================================
  function fmtMoney(v) {
    const sign = v > 0 ? '+' : v < 0 ? '−' : '';
    return sign + '$' + Math.abs(v).toLocaleString('en-US', {maximumFractionDigits: 0});
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 2500);
  }
  function setSync(st, text) {
    const el = document.getElementById('sync-status');
    el.className = 'sync-status ' + st;
    document.getElementById('sync-text').textContent = text;
  }

  function checkAuth() {
    isEditor = localStorage.getItem(AUTH_KEY) === 'true';
    updateAuthUI();
  }

  function updateAuthUI() {
    const btn = document.getElementById('auth-btn');
    if (isEditor) { btn.classList.add('editor'); btn.textContent = 'Editor'; }
    else { btn.classList.remove('editor'); btn.textContent = '🔒'; }
    document.querySelectorAll('.add-btn').forEach(b => b.style.display = isEditor ? 'flex' : 'none');
    document.querySelectorAll('.del-btn').forEach(b => b.style.display = isEditor ? 'block' : 'none');
    document.querySelectorAll('.del-ch').forEach(b => b.style.display = isEditor ? 'flex' : 'none');
  }

  document.getElementById('auth-btn').onclick = () => {
    if (isEditor) {
      if(confirm('Exit editor mode?')) { localStorage.removeItem(AUTH_KEY); isEditor = false; checkAuth(); renderMain(); }
    } else {
      const pwd = prompt('Enter password:');
      if (pwd === PASSWORD) { localStorage.setItem(AUTH_KEY, 'true'); isEditor = true; checkAuth(); renderMain(); if(currentChallengeId) renderDetail(currentChallengeId); }
      else if (pwd !== null) { alert('Wrong password'); }
    }
  };

  // ============================================
  // RENDER MAIN
  // ============================================
  function renderMain() {
    document.getElementById('view-main').style.display = 'block';
    document.getElementById('view-detail').style.display = 'none';
    currentChallengeId = null;

    const list = document.getElementById('challenges-list');
    document.getElementById('challenges-count').textContent = state.challenges.length;

    if (state.challenges.length === 0) {
      list.innerHTML = '<div style="color:#666; font-size:14px; text-align:center; padding:20px;">No challenges yet.</div>';
      return;
    }

    list.innerHTML = state.challenges.slice().reverse().map(ch => {
      const trades = ch.trades || [];
      const pnl = trades.reduce((sum, t) => sum + (t.pnl || 0), 0);
      const targetUsd = ch.size * ch.target / 100;
      const totalLimitUsd = ch.size * (ch.total || 10) / 100;
      
      let statusClass = 'active', statusText = 'Active', progress = 0, barColor = '';
      
      if (pnl <= -totalLimitUsd) {
        statusClass = 'failed'; statusText = 'Failed'; progress = 100; barColor = 'bg-red';
      } else if (pnl >= targetUsd) {
        statusClass = 'passed'; statusText = 'Passed'; progress = 100; barColor = 'bg-green';
      } else {
        progress = Math.min(100, (Math.max(0, pnl) / targetUsd) * 100);
      }

      const delBtn = isEditor ? `<button class="del-ch" onclick="deleteChallenge('${ch.id}', event)">✕</button>` : '';

      return `
        <div class="challenge-card" onclick="openChallenge('${ch.id}')">
          ${delBtn}
          <div class="challenge-header">
            <div class="challenge-name-wrap">
              <div class="challenge-name">${ch.name}</div>
              <div class="challenge-meta">$${ch.size.toLocaleString('en-US')} · ${trades.length} trades</div>
            </div>
            <div class="challenge-status ${statusClass}">${statusText}</div>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill ${barColor}" style="width: ${progress}%"></div></div>
          <div class="progress-text">
            <span>P&L: <b>${fmtMoney(pnl)}</b></span>
            <span>Target: <b>${fmtMoney(targetUsd)}</b></span>
          </div>
        </div>
      `;
    }).join('');
    updateAuthUI();
  }

  window.deleteChallenge = function(id, event) {
    event.stopPropagation();
    if (!isEditor) return;
    if (!confirm('Delete challenge and all trades?')) return;
    state.challenges = state.challenges.filter(c => c.id !== id);
    saveData(); renderMain(); showToast('Deleted');
  };

  // ============================================
  // RENDER DETAIL
  // ============================================
  window.openChallenge = function(id) {
    currentChallengeId = id;
    document.getElementById('view-main').style.display = 'none';
    document.getElementById('view-detail').style.display = 'block';
    document.getElementById('view-detail').classList.add('fade-in');
    renderDetail(id);
  };

  function renderDetail(id) {
    const ch = state.challenges.find(c => c.id === id);
    if (!ch) return;
    const trades = ch.trades || [];
    const pnl = trades.reduce((sum, t) => sum + (t.pnl || 0), 0);
    const targetUsd = ch.size * ch.target / 100;
    const totalLimitUsd = ch.size * (ch.total || 10) / 100;
    
    let progress = 0, statusText = 'In Progress', barClass = '';
    if (pnl <= -totalLimitUsd) { progress = 100; statusText = '❌ Failed (Limit)'; barClass = 'bg-red'; }
    else if (pnl >= targetUsd) { progress = 100; statusText = '✅ Passed'; barClass = 'bg-green'; }
    else { progress = Math.min(100, (Math.max(0, pnl) / targetUsd) * 100); }

    const wins = trades.filter(t => t.pnl > 0).length;
    const wr = trades.length ? Math.round((wins / trades.length) * 100) : 0;
    const validRRs = trades.filter(t => t.rr && !isNaN(t.rr));
    const avgRR = validRRs.length ? (validRRs.reduce((sum, t) => sum + parseFloat(t.rr), 0) / validRRs.length) : 0;

    document.getElementById('detail-name').textContent = ch.name;
    document.getElementById('detail-wr').textContent = wr + '%';
    document.getElementById('detail-rr').textContent = avgRR.toFixed(2);
    document.getElementById('detail-trades').textContent = trades.length;
    document.getElementById('detail-progress-bar').style.width = progress + '%';
    document.getElementById('detail-progress-bar').className = 'progress-bar-fill ' + barClass;
    document.getElementById('detail-target-text').textContent = fmtMoney(targetUsd);
    document.getElementById('detail-status-text').textContent = statusText;
    document.getElementById('detail-status-text').style.color = statusText.includes('✅') ? '#10b981' : statusText.includes('❌') ? '#ef4444' : '#888';

    const list = document.getElementById('trades-list');
    if (trades.length === 0) {
      list.innerHTML = '<div style="color:#666; font-size:14px; text-align:center; padding:20px;">No trades yet.</div>';
      return;
    }

    list.innerHTML = trades.slice().reverse().map((t, idx) => {
      const realIdx = trades.length - 1 - idx;
      const pnlClass = t.pnl > 0 ? 'pos' : t.pnl < 0 ? 'neg' : '';
      const dirClass = t.dir === 'long' ? 'long' : 'short';
      const dirText = t.dir === 'long' ? 'L' : 'S';
      const dateStr = t.date ? t.date.split('-').reverse().join('.') : '';
      const rrBadge = t.rr ? `<span class="badge rr">RR ${parseFloat(t.rr).toFixed(1)}</span>` : '';
      const delBtn = isEditor ? `<button class="del-btn" onclick="deleteTrade(${realIdx}, event)">×</button>` : '';

      return `
        <div class="trade-item">
          <div class="trade-left">
            <div class="trade-ticker">${t.ticker} <span class="badge ${dirClass}">${dirText}</span> ${rrBadge}</div>
            <div class="trade-date">${dateStr} ${t.note ? '· ' + t.note : ''}</div>
          </div>
          <div class="trade-right"><div class="trade-pnl ${pnlClass}">${fmtMoney(t.pnl)}</div>${delBtn}</div>
        </div>
      `;
    }).join('');
    updateAuthUI();
  }

  window.deleteTrade = function(idx, event) {
    event.stopPropagation();
    if (!isEditor) return;
    if (!confirm('Delete trade?')) return;
    const ch = state.challenges.find(c => c.id === currentChallengeId);
    ch.trades.splice(idx, 1); saveData(); renderDetail(currentChallengeId);
  };

  document.getElementById('btn-back').onclick = renderMain;

  // ============================================
  // RR CALCULATOR
  // ============================================
  function calcRR() {
    const entry = parseFloat(document.getElementById('tr-entry').value);
    const stop = parseFloat(document.getElementById('tr-stop').value);
    const take = parseFloat(document.getElementById('tr-take').value);
    const display = document.getElementById('tr-rr-display');
    if (!entry || !stop || !take) { display.textContent = '—'; return null; }
    const risk = Math.abs(entry - stop);
    const reward = Math.abs(take - entry);
    if (risk === 0) { display.textContent = '—'; return null; }
    const rr = (reward / risk).toFixed(2);
    display.textContent = rr;
    return rr;
  }
  ['tr-entry', 'tr-stop', 'tr-take'].forEach(id => document.getElementById(id).addEventListener('input', calcRR));

  // ============================================
  // MODALS
  // ============================================
  document.getElementById('btn-add-challenge').onclick = () => {
    document.getElementById('new-ch-name').value = '';
    document.getElementById('new-ch-size').value = '10000';
    document.getElementById('new-ch-target').value = '8';
    document.getElementById('new-ch-daily').value = '5';
    document.getElementById('new-ch-total').value = '10';
    document.getElementById('modal-challenge').classList.add('on');
  };
  document.getElementById('cancel-ch').onclick = () => document.getElementById('modal-challenge').classList.remove('on');
  
  document.getElementById('save-ch').onclick = () => {
    const name = document.getElementById('new-ch-name').value.trim();
    const size = parseFloat(document.getElementById('new-ch-size').value) || 10000;
    const target = parseFloat(document.getElementById('new-ch-target').value) || 8;
    const daily = parseFloat(document.getElementById('new-ch-daily').value) || 5;
    const total = parseFloat(document.getElementById('new-ch-total').value) || 10;
    if (!name) { alert('Enter name'); return; }
    state.challenges.push({ id: Date.now().toString(), name, size, target, daily, total, trades: [] });
    saveData(); document.getElementById('modal-challenge').classList.remove('on');
    renderMain(); showToast('Challenge created');
  };

  document.getElementById('btn-add-trade').onclick = () => {
    document.getElementById('tr-ticker').value = 'NDX100';
    document.getElementById('tr-pnl').value = '';
    document.getElementById('tr-entry').value = '';
    document.getElementById('tr-stop').value = '';
    document.getElementById('tr-take').value = '';
    document.getElementById('tr-rr-display').textContent = '—';
    document.getElementById('tr-note').value = '';
    document.getElementById('tr-date').value = new Date().toISOString().split('T')[0];
    currentDir = 'long'; updateDirButtons();
    document.getElementById('modal-trade').classList.add('on');
  };
  document.getElementById('cancel-tr').onclick = () => document.getElementById('modal-trade').classList.remove('on');

  function updateDirButtons() {
    document.getElementById('btn-long').className = 'dir-btn ' + (currentDir === 'long' ? 'active-long' : '');
    document.getElementById('btn-short').className = 'dir-btn ' + (currentDir === 'short' ? 'active-short' : '');
  }
  document.getElementById('btn-long').onclick = () => { currentDir = 'long'; updateDirButtons(); };
  document.getElementById('btn-short').onclick = () => { currentDir = 'short'; updateDirButtons(); };

  document.getElementById('save-tr').onclick = () => {
    const ticker = document.getElementById('tr-ticker').value.trim().toUpperCase();
    const pnl = parseFloat(document.getElementById('tr-pnl').value) || 0;
    const rr = calcRR();
    const date = document.getElementById('tr-date').value;
    const note = document.getElementById('tr-note').value.trim();

    if (!ticker) { alert('Enter ticker'); return; }
    const ch = state.challenges.find(c => c.id === currentChallengeId);
    ch.trades.push({ ticker, dir: currentDir, pnl, rr, date, note });
    saveData(); document.getElementById('modal-trade').classList.remove('on');
    renderDetail(currentChallengeId); showToast('Trade added');
  };

  // ============================================
  // SAVE / LOAD
  // ============================================
  function saveData() {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(state)); } catch(e) {}
    if (isEditor && DOC_REF) {
      setSync('syncing', 'Saving...');
      DOC_REF.set({ state: state })
        .then(() => setSync('online', 'Synced'))
        .catch(e => { console.warn(e); setSync('error', 'Sync error'); });
    }
  }

  function loadData() {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(state)); } catch(e) {}
    if (DOC_REF) {
      setSync('syncing', 'Connecting...');
      DOC_REF.get().then(snap => {
        if (snap.exists && snap.data().state) {
          state = snap.data().state;
          if (!state.challenges) state.challenges = [];
          setSync('online', 'Synced from cloud');
          renderMain();
          if (currentChallengeId) renderDetail(currentChallengeId);
        } else {
          setSync('online', 'Local data');
        }
      }).catch(e => { console.warn(e); setSync('error', 'Connection error'); });
    } else {
      setSync('error', 'Offline');
    }
  }

  checkAuth();
  renderMain();
  loadData();
</script>
</body>
</html>
